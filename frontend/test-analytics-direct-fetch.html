<!DOCTYPE html>
<html>
<head>
    <title>Test Analytics Direct Fetch</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Test Analytics Direct Fetch from Frontend</h1>
    <p>Testing if frontend can directly fetch analytics data from backend</p>
    
    <button onclick="testOverview()">Test Overview</button>
    <button onclick="testAllEndpoints()">Test All Endpoints</button>
    <div id="results"></div>

    <script>
        async function testOverview() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">🔄 Testing overview endpoint...</div>';
            
            try {
                const response = await fetch('http://localhost:3001/api/analytics/overview', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const resultDiv = document.createElement('div');
                resultDiv.className = 'result';
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className += ' success';
                    resultDiv.innerHTML = `
                        <h3>✅ Overview Data</h3>
                        <p><strong>Cars:</strong> ${data.totalCars}</p>
                        <p><strong>Users:</strong> ${data.totalUsers}</p>
                        <p><strong>Bookings:</strong> ${data.totalBookings}</p>
                        <p><strong>Revenue:</strong> ₹${data.totalRevenue}</p>
                        <p><strong>Active Bookings:</strong> ${data.bookingsByStatus?.active || 0}</p>
                        <details>
                            <summary>Raw Data</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    resultDiv.className += ' error';
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <h3>❌ Overview Failed</h3>
                        <p>Status: ${response.status}</p>
                        <p>Error: ${errorText}</p>
                    `;
                }
                
                resultsDiv.innerHTML = '';
                resultsDiv.appendChild(resultDiv);
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function testAllEndpoints() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">🔄 Testing all analytics endpoints...</div>';
            
            const endpoints = [
                { path: '/analytics/overview', name: 'Overview' },
                { path: '/analytics/cars', name: 'Cars Analytics' },
                { path: '/analytics/bookings', name: 'Bookings Analytics' },
                { path: '/analytics/revenue', name: 'Revenue Analytics' },
                { path: '/analytics/popular-cars', name: 'Popular Cars' }
            ];
            
            resultsDiv.innerHTML = '';
            
            for (const endpoint of endpoints) {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'result';
                resultDiv.innerHTML = `<h3>🔄 Testing ${endpoint.name}...</h3>`;
                resultsDiv.appendChild(resultDiv);
                
                try {
                    const response = await fetch(`http://localhost:3001/api${endpoint.path}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        resultDiv.className += ' success';
                        
                        let summary = '';
                        if (endpoint.path === '/analytics/overview') {
                            summary = `Cars: ${data.totalCars}, Users: ${data.totalUsers}, Revenue: ₹${data.totalRevenue}`;
                        } else if (endpoint.path === '/analytics/cars') {
                            summary = `Total: ${data.totalCars}, Available: ${data.availableCars}, Utilization: ${data.utilizationRate}%`;
                        } else if (endpoint.path === '/analytics/popular-cars') {
                            summary = `${data.length} cars found`;
                        }
                        
                        resultDiv.innerHTML = `
                            <h3>✅ ${endpoint.name}</h3>
                            <p>${summary}</p>
                            <details>
                                <summary>View Data</summary>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </details>
                        `;
                    } else {
                        resultDiv.className += ' error';
                        const errorText = await response.text();
                        resultDiv.innerHTML = `
                            <h3>❌ ${endpoint.name}</h3>
                            <p>Status: ${response.status}</p>
                            <p>Error: ${errorText}</p>
                        `;
                    }
                } catch (error) {
                    resultDiv.className += ' error';
                    resultDiv.innerHTML = `
                        <h3>❌ ${endpoint.name}</h3>
                        <p>Network Error: ${error.message}</p>
                    `;
                }
            }
        }
        
        // Auto-run overview test
        window.addEventListener('load', () => {
            setTimeout(testOverview, 1000);
        });
    </script>
</body>
</html>

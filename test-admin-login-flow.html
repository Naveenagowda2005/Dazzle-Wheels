<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Login Flow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Admin Login Flow Test</h1>
    
    <div class="test-section info">
        <h3>Test Configuration</h3>
        <p><strong>Frontend URL:</strong> http://localhost:3000</p>
        <p><strong>Backend URL:</strong> http://localhost:3001</p>
        <p><strong>Admin Credentials:</strong> admin@dazzlewheels.com / DazzleAdmin@2024!</p>
    </div>

    <div class="test-section">
        <h3>1. Test Backend Auth API</h3>
        <button onclick="testBackendAuth()">Test Backend Login</button>
        <div id="backend-result"></div>
    </div>

    <div class="test-section">
        <h3>2. Test Frontend Auth Service</h3>
        <button onclick="testFrontendAuthService()">Test Auth Service</button>
        <div id="frontend-auth-result"></div>
    </div>

    <div class="test-section">
        <h3>3. Test Session Storage</h3>
        <button onclick="testSessionStorage()">Check Session</button>
        <button onclick="clearSession()">Clear Session</button>
        <div id="session-result"></div>
    </div>

    <div class="test-section">
        <h3>4. Test Admin Page Access</h3>
        <button onclick="testAdminAccess()">Test Admin Access</button>
        <div id="admin-access-result"></div>
    </div>

    <script>
        // Test backend auth API directly
        async function testBackendAuth() {
            const resultDiv = document.getElementById('backend-result');
            resultDiv.innerHTML = '<p>Testing backend auth...</p>';
            
            try {
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@dazzlewheels.com',
                        password: 'DazzleAdmin@2024!'
                    }),
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Backend Auth Success!</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    const errorData = await response.json();
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Backend Auth Failed!</h4>
                            <p>Status: ${response.status}</p>
                            <pre>${JSON.stringify(errorData, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Backend Auth Error!</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Test frontend auth service (simulating the auth service)
        async function testFrontendAuthService() {
            const resultDiv = document.getElementById('frontend-auth-result');
            resultDiv.innerHTML = '<p>Testing frontend auth service...</p>';
            
            try {
                // Simulate the auth service login
                const apiUrl = 'http://localhost:3001/api/auth/login';
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@dazzlewheels.com',
                        password: 'DazzleAdmin@2024!'
                    }),
                });

                if (response.ok) {
                    const { access_token, user } = await response.json();
                    
                    // Store session data locally (like the auth service does)
                    const sessionData = {
                        user,
                        access_token,
                        expires_at: Date.now() + (7 * 24 * 60 * 60 * 1000) // 7 days
                    };
                    
                    localStorage.setItem('dazzle_session', JSON.stringify(sessionData));
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✅ Frontend Auth Service Success!</h4>
                            <p><strong>User:</strong> ${user.name} (${user.role})</p>
                            <p><strong>Email:</strong> ${user.email}</p>
                            <p><strong>Session stored:</strong> Yes</p>
                            <pre>${JSON.stringify(sessionData, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    const errorData = await response.json();
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ Frontend Auth Service Failed!</h4>
                            <p>Status: ${response.status}</p>
                            <pre>${JSON.stringify(errorData, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Frontend Auth Service Error!</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Test session storage
        function testSessionStorage() {
            const resultDiv = document.getElementById('session-result');
            
            try {
                const sessionData = localStorage.getItem('dazzle_session');
                
                if (sessionData) {
                    const session = JSON.parse(sessionData);
                    const isExpired = Date.now() > session.expires_at;
                    
                    resultDiv.innerHTML = `
                        <div class="${isExpired ? 'error' : 'success'}">
                            <h4>${isExpired ? '⚠️' : '✅'} Session Found ${isExpired ? '(Expired)' : '(Valid)'}</h4>
                            <p><strong>User:</strong> ${session.user?.name} (${session.user?.role})</p>
                            <p><strong>Email:</strong> ${session.user?.email}</p>
                            <p><strong>Expires:</strong> ${new Date(session.expires_at).toLocaleString()}</p>
                            <p><strong>Token:</strong> ${session.access_token ? 'Present' : 'Missing'}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="info">
                            <h4>ℹ️ No Session Found</h4>
                            <p>No session data in localStorage</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Session Error!</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Clear session
        function clearSession() {
            localStorage.removeItem('dazzle_session');
            document.getElementById('session-result').innerHTML = `
                <div class="info">
                    <h4>🗑️ Session Cleared</h4>
                    <p>Session data removed from localStorage</p>
                </div>
            `;
        }

        // Test admin page access
        function testAdminAccess() {
            const resultDiv = document.getElementById('admin-access-result');
            
            resultDiv.innerHTML = `
                <div class="info">
                    <h4>🔗 Admin Page Links</h4>
                    <p><a href="http://localhost:3000/admin/login" target="_blank">Admin Login Page</a></p>
                    <p><a href="http://localhost:3000/admin" target="_blank">Admin Dashboard</a></p>
                    <p><strong>Note:</strong> Open these links in new tabs to test the actual pages</p>
                </div>
            `;
        }

        // Auto-run session check on page load
        window.onload = function() {
            testSessionStorage();
        };
    </script>
</body>
</html>
